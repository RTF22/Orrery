  <body>
    <div id="root">
      <!-- Für Suchmaschinen und Screenreader vor dem Start der App; React
           ersetzt den Inhalt beim Einhängen durch dieselben Texte (App.tsx). -->
      <h1 class="sr-only">Orrery – das Sonnensystem in 3D</h1>
      <p class="sr-only">Das Sonnensystem als interaktive 3D-Simulation im Browser: physikalisch gerechnete Bahnen, Finsternisse und Ringschatten, erklärt in drei Niveaustufen.</p>
    </div>
    <noscript>
      <!-- Hinweis für Browser ohne JavaScript (z. B. NoScript). Pfade relativ, weil Vite den Inhalt
           von noscript nicht umschreibt; das Bild liegt in public/. -->
      <style>
        .ohne-js { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: #05070d; color: #e8edf7;
          font-family: system-ui, sans-serif; line-height: 1.6; }
        .ohne-js-sonne { position: absolute; left: -12vmax; top: -12vmax; width: 48vmax; height: 48vmax; border-radius: 50%;
          background: radial-gradient(circle, #fff6c0 0%, #ffd66b 10%, #f5a623 20%, rgb(245 166 35 / 0.3) 38%, rgb(245 166 35 / 0) 62%); }
        .ohne-js-bild { position: absolute; right: 0; bottom: 0; width: min(100%, 110vh); height: auto; mix-blend-mode: screen;
          -webkit-mask-image: radial-gradient(ellipse 50% 50% at 58% 58%, #000 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 50% at 58% 58%, #000 55%, transparent 100%); }
        .ohne-js-text { position: relative; box-sizing: border-box; max-width: 36rem; margin: 18vh 0 4rem 6vw; padding: 1.5rem 1.75rem;
          background: rgb(5 7 13 / 0.72); border: 1px solid #1f2a44; border-radius: 14px; }
        .ohne-js-text h2 { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 400; letter-spacing: 0.04em; }
        .ohne-js-text p { margin: 0 0 0.9rem; }
        .ohne-js-text a { color: #58a6ff; }
        .ohne-js-text hr { border: 0; border-top: 1px solid #1f2a44; margin: 1.25rem 0; }
        .ohne-js-links { font-size: 0.9rem; }
        @media (max-width: 40rem) {
          .ohne-js-bild { top: 0; bottom: auto; right: -15%; width: 170%; }
          .ohne-js-text { margin: 42vw 1rem 2rem; }
        }
      </style>
      <div class="ohne-js">
        <div class="ohne-js-sonne" aria-hidden="true"></div>
        <img class="ohne-js-bild" src="saturn-ohne-js.webp" width="1600" height="900" alt="" />
        <div class="ohne-js-text">
          <h2>Orrery braucht JavaScript</h2>
          <p>Orrery berechnet das Sonnensystem live in Ihrem Browser und zeichnet es mit WebGL. Dafür ist JavaScript nötig. Bitte erlauben Sie JavaScript für orrery3d.de – in NoScript etwa über „Vertrauen“ – und laden Sie die Seite neu.</p>
          <p>Orrery lädt nichts von fremden Servern und setzt keine Cookies.</p>
          <p class="ohne-js-links"><a href="doku/making-of/de/">Wie Orrery entstand</a> · <a href="https://github.com/RTF22/Orrery">Quelltext auf GitHub</a> · <a href="https://jensfricke.com/impressum/">Impressum</a> · <a href="https://jensfricke.com/datenschutz/orrery/">Datenschutz</a></p>
          <hr />
          <div lang="en">
            <h2>Orrery needs JavaScript</h2>
            <p>Orrery computes the solar system live in your browser and draws it with WebGL, which requires JavaScript. Please allow JavaScript for orrery3d.de – in NoScript, for example, via “Trusted” – and reload the page.</p>
            <p>Orrery loads nothing from third-party servers and sets no cookies.</p>
            <p class="ohne-js-links"><a href="doku/making-of/en/">How Orrery was made</a> · <a href="https://github.com/RTF22/Orrery">Source code on GitHub</a> · <a href="https://jensfricke.com/en/legal-notice/">Legal notice</a> · <a href="https://jensfricke.com/en/privacy/orrery/">Privacy</a></p>
          </div>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
